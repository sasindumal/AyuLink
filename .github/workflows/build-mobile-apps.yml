name: Build Mobile Apps

# Triggers:
#  1. Pushing a version tag (v1.0.0, v2.3.1, ...) -> release named after the tag.
#  2. Manual dispatch from the Actions tab -> release named "manual-<run number>".
# Both paths mark the new release as GitHub's "latest" release, so the stable
# download URLs below always serve the most recent APKs regardless of trigger:
#   https://github.com/<owner>/<repo>/releases/latest/download/patient-app.apk
#   https://github.com/<owner>/<repo>/releases/latest/download/doctor-app.apk
#   https://github.com/<owner>/<repo>/releases/latest/download/pharmacy-app.apk
#   https://github.com/<owner>/<repo>/releases/latest/download/channeling-center-app.apk
#
# Requires a repository secret EXPO_TOKEN (an Expo personal access token with
# access to the orton.com account) — see expo.dev/accounts/<you>/settings/access-tokens

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - patient-app
          - doctor-app
          - pharmacy-app
          - channeling-center-app
    defaults:
      run:
        working-directory: frontend/mobile/${{ matrix.app }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mobile/${{ matrix.app }}/package-lock.json

      - name: Enable Corepack
        run: corepack enable

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build APK on EAS
        run: eas build --platform android --profile apk --non-interactive --wait --json > build-result.json

      - name: Download built APK
        run: |
          BUILD_URL=$(node -e "
            const r = require('./build-result.json');
            const b = Array.isArray(r) ? r[0] : r;
            if (!b || !b.artifacts || !b.artifacts.buildUrl) {
              console.error('No build artifact URL in EAS response:', JSON.stringify(b));
              process.exit(1);
            }
            console.log(b.artifacts.buildUrl);
          ")
          echo "Downloading $BUILD_URL"
          curl -fL -o "${{ matrix.app }}.apk" "$BUILD_URL"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: frontend/mobile/${{ matrix.app }}/${{ matrix.app }}.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built APKs
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Collect APKs under fixed filenames
        run: |
          mkdir -p release
          for dir in apks/*/; do
            name=$(basename "$dir")
            cp "$dir$name.apk" "release/$name.apk"
          done
          ls -la release

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=manual-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: AyuLink Mobile Apps — ${{ steps.tag.outputs.name }}
          make_latest: "true"
          files: release/*.apk
